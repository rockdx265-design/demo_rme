<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shield / Rounded Hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#primaryGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="10" y="10" width="80" height="80" rx="22" stroke="white" stroke-opacity="0.2" stroke-width="2" />
  
  <!-- Medical Cross / Pulse Symbol -->
  <path d="M50 24 L50 76 M24 50 L76 50" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />
  
  <!-- Heartbeat / EKG Pulse Line -->
  <path d="M22 51 L36 51 L42 35 L48 65 L54 42 L58 51 L78 51" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Small Doctor Cross Accent -->
  <circle cx="72" cy="28" r="5" fill="#a7f3d0" />
</svg>
